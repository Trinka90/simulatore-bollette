name: Compila APK

on:
  push:
    branches: [main]
    paths-ignore: ["data/**", "README.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Dipendenze, test e build web
        run: |
          npm ci
          npm test
          VERSIONE_WEB=${{ github.run_number }} npm run build
          npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK (preinstallato sul runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compila APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../SimulatoreBollette-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v5
        with:
          name: SimulatoreBollette-apk
          path: SimulatoreBollette-*.apk

      - name: Pubblica in Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Simulatore Bollette 1.0.${{ github.run_number }}
          files: SimulatoreBollette-*.apk
          make_latest: true
          body: |
            Scarica il file .apk dal telefono e aprilo per installarlo
            (la prima volta Android chiede di consentire l'installazione da questa fonte).
            Dalla versione 1.0.10 l'app si aggiorna da sola all'apertura.

      - name: Pacchetto per l'aggiornamento automatico
        run: |
          (cd www && zip -qr ../web.zip .)
          NATIVA=$(node -p "require('./package.json').versioneNativa")
          SHA=$(sha256sum web.zip | cut -d' ' -f1)
          REPO=https://github.com/${{ github.repository }}/releases/download
          cat > versione.json <<JSON
          {"web": "${{ github.run_number }}", "nativa": $NATIVA, "zip": "$REPO/web/web.zip", "checksum": "$SHA",
           "apk": "$REPO/v1.0.${{ github.run_number }}/SimulatoreBollette-1.0.${{ github.run_number }}.apk", "data": "$(date -u +%FT%TZ)"}
          JSON
          cat versione.json

      - name: Pubblica l'aggiornamento automatico
        uses: softprops/action-gh-release@v2
        with:
          tag_name: web
          name: Aggiornamento automatico (non scaricare)
          make_latest: false
          prerelease: true
          overwrite_files: true
          files: |
            versione.json
            web.zip
          body: File usati dall'app per aggiornarsi da sola. Non servono da scaricare a mano.
