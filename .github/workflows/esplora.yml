name: Esplora open data
on:
  push:
    branches: [esplora-opendata]
    paths: [".github/workflows/esplora.yml"]
permissions:
  contents: write
jobs:
  scarica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scarica
        run: |
          mkdir -p campioni
          curl -sSL -m 120 -o campioni/manuale.pdf "https://siiportale.acquirenteunico.it/documents/11387888/11426823/Manuale+Operativo+compilazione+Offerte+Mercato+Libero.pdf/72f39e61-a842-476b-04c1-151f90eb51b6?t=1752243895118&download=true" -w "manuale %{http_code} %{size_download}\n" || true
          file campioni/manuale.pdf
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add campioni; git commit -m "manuale" && git push
